<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CamConnect - Admin Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #fff; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .login-box, .dashboard { background: #1e293b; padding: 30px; border-radius: 10px; width: 100%; max-width: 400px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        input { width: 100%; padding: 10px; margin: 10px 0; background: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #3b82f6; border: none; color: white; border-radius: 5px; cursor: pointer; font-weight: bold; }
        button:hover { background: #2563eb; }
        .hidden { display: none !important; }
        .stats { display: flex; justify-content: space-between; margin-bottom: 20px; }
        .card { background: #334155; padding: 15px; border-radius: 8px; width: 45%; text-align: center; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 14px; }
        th, td { padding: 8px; text-align: left; border-bottom: 1px solid #334155; }
        .error { color: #ef4444; font-size: 13px; margin-top: 5px; }
    </style>
</head>
<body>

    <!-- SECTION CONNEXION -->
    <div id="loginSection" class="login-box">
        <h2>🔒 Administration</h2>
        <p style="color: #94a3b8; font-size: 14px;">Entre le mot de passe administrateur.</p>
        <input type="password" id="adminPasswordInput" placeholder="Mot de passe">
        <button onclick="login()">Se connecter</button>
        <div id="loginError" class="error"></div>
    </div>

    <!-- SECTION TABLEAU DE BORD -->
    <div id="dashboardSection" class="dashboard hidden" style="max-width: 800px;">
        <h2>📊 Tableau de bord CamConnect</h2>
        <div class="stats">
            <div class="card">
                <h3>En ligne</h3>
                <p id="statOnline" style="font-size: 24px; font-weight: bold;">0</p>
            </div>
            <div class="card">
                <h3>VIP Actifs</h3>
                <p id="statVip" style="font-size: 24px; font-weight: bold;">0</p>
            </div>
        </div>

        <h3>Utilisateurs connectés</h3>
        <table>
            <thead>
                <tr>
                    <th>Pseudo</th>
                    <th>IP</th>
                    <th>VIP</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="usersTableBody">
                <!-- Rempli dynamiquement -->
            </tbody>
        </table>
    </div>

    <!-- Socket.io client -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        function login() {
            const pwd = document.getElementById('adminPasswordInput').value;
            socket.emit('admin-login', pwd);
        }

        socket.on('admin-auth-success', () => {
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('dashboardSection').classList.remove('hidden');
        });

        socket.on('admin-auth-error', (msg) => {
            document.getElementById('loginError').innerText = msg;
        });

        socket.on('admin-stats-update', (data) => {
            updateStats(data);
        });

        socket.on('admin-stats-broadcast', (data) => {
            updateStats(data);
        });

        function updateStats(data) {
            document.getElementById('statOnline').innerText = data.onlineCount;
            document.getElementById('statVip').innerText = data.vipCount;

            const tbody = document.getElementById('usersTableBody');
            tbody.innerHTML = '';

            if (data.users) {
                data.users.forEach(u => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${u.username}</td>
                        <td>${u.ip}</td>
                        <td>${u.isVip ? '⭐ Oui' : 'Non'}</td>
                        <td><button style="padding: 4px 8px; background: #ef4444;" onclick="banUser('${u.id}')">Bannir</button></td>
                    `;
                    tbody.appendChild(tr);
                });
            }
        }

        function banUser(userId) {
            socket.emit('admin-ban-user', userId);
        }
    </script>
</body>
</html>
